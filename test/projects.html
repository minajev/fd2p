<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8" />
  <title>FD2P — Projects</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="FD2P engineering projects — page under construction." />

  <!-- Global site styles -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preload" as="image" href="assets/logo2.jpg" />

  <!-- Page-local styles (mirrors Manufacturing page structure) -->
  <style>
    /* Hide full nav until JS sets the correct state */
    .projects-page:not(.js-ready-projects) .site-header .main-nav{
      position:absolute; right:0; top:0; height:var(--header-h);
      opacity:0; visibility:hidden; pointer-events:none;
    }
    .projects-page:not(.js-ready-projects) .menu-toggle{
      opacity:0; visibility:hidden; pointer-events:none;
    }

    /* Desktop defaults for this page (switched by .is-mobile-projects) */
    .projects-page .menu-toggle { display: none; }
    .projects-page .main-nav { display: flex; }

    /* Mobile state toggled by JS based on data-burger-bp */
    .projects-page.is-mobile-projects .menu-toggle { display: block; }
    .projects-page.is-mobile-projects .main-nav { display: none; }

    /* Hero */
    .page-hero{ padding:48px 0 24px; border-bottom:0; }
    .page-hero .hero-grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items:center;
    }
    .page-hero h1{ margin:8px 0 0; font-size:clamp(28px,4.4vw,40px); line-height:1.08; text-transform:uppercase; text-align:left; }
    .page-hero p{ margin:0; color:var(--muted); }
    @media (max-width: 768px){
      .page-hero .hero-grid{ grid-template-columns: 1fr; }
      .page-hero h1{ text-align:left; margin-top:6px; }
      .page-hero p + p{ margin-top:8px; }
    }

    /* Section shell */
    .section{ padding: 50px 0; }

/* Keep footer at bottom even with little content */
html, body { height: 100%; }
body.projects-page {
  display: flex;
  flex-direction: column;
}
.site-footer {
  margin-top: auto;
}

    /* Align cards with page margins (kept for parity; not used here) */
    .projects-page .stack { padding-left: 0; padding-right: 0; }

/* Center construction content evenly between header and footer */
.page-hero {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  min-height: calc(100vh - 64px - 220px); /* высота окна минус header и footer */
  box-sizing: border-box;
}

.page-hero h1 {
  margin-top: 0 !important;
  margin-bottom: 40px !important;
}
    
  </style>
</head>

<body class="projects-page is-collapsed" data-burger-bp="500">
  <!-- HEADER (exactly like Manufacturing) -->
  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="FD2P — Home">
        <img src="assets/logo2.jpg" alt="FD2P small logo"
             onerror="this.onerror=null;this.src='assets/logo1.jpg'"/>
      </a>

      <nav class="main-nav" aria-label="Primary" hidden>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="projects.html" aria-current="page">Projects</a>
        <a href="about.html">About</a>
        <a class="btn btn-outline btn-outline-dark" href="contact.html">Contact</a>
      </nav>

      <button class="menu-toggle btn btn-outline-dark" type="button"
              aria-label="Open menu" aria-expanded="false">☰ Menu</button>
    </div>
  </header>

  <!-- OFFCANVAS (copied) -->
  <div class="offcanvas" aria-hidden="true">
    <div class="offcanvas-backdrop"></div>
    <aside class="offcanvas-panel" role="dialog" aria-modal="true" aria-label="Site menu">
      <div class="offcanvas-head">
        <a class="offcanvas-brand" href="index.html" aria-label="FD2P — Home">
          <img src="assets/logo2.jpg" alt="FD2P small logo" />
        </a>
        <button class="offcanvas-close" type="button" aria-label="Close menu">✕</button>
      </div>
      <nav class="offcanvas-nav" aria-label="Mobile"></nav>
    </aside>
  </div>

  <!-- HERO -->
<section class="page-hero">
  <div class="container" style="text-align:center;">
    <h1 style="
      text-align:center;
      font-size:clamp(32px,5vw,48px);
      margin-top:80px;
      margin-bottom:40px;
      text-transform:uppercase;
    ">
      This page is under construction
    </h1>
    <img src="assets/construction.jpg"
         alt="Robot under construction"
         style="
           max-width:1000px;
           width:100%;
           height:auto;
           display:inline-block;
         ">
  </div>
</section>

  <!-- FOOTER (exact copy used across internal pages) -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-brand">
          <h3>FD<span style="color:#E30613;">2</span>P Technologies</h3>
        </div>
        <div class="footer-contacts">
          <p>Email: <a href="mailto:info@fd2p.com">info@fd2p.com</a></p>
          <p>Phone: <a href="tel:+37256279949">+372 56 279 949</a></p>
          <p>Address: Kivimurru 34, Tallinn, Estonia</p>
        </div>
      </div>
    </div>
  </footer>

  <!-- Global scripts -->
  <script src="js/main.js"></script>

  <!-- Burger breakpoint + page-ready flag -->
  <script>
    (function(){
      var bp = parseInt(document.body.getAttribute('data-burger-bp') || '500', 10);
      function apply(){ document.body.classList.toggle('is-mobile-projects', window.innerWidth <= bp); }
      function init(){ apply(); document.body.classList.add('js-ready-projects'); }
      window.addEventListener('resize', apply, {passive:true});
      window.addEventListener('orientationchange', apply, {passive:true});
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
    })();
  </script>
</body>
</html>
